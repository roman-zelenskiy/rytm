<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a0b" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/fira-xcond-black.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/golos.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<style>
			@font-face {
				font-family: 'Fira XCond';
				src: url('%sveltekit.assets%/fonts/fira-xcond-black.woff2') format('woff2');
				font-weight: 900;
				font-display: optional;
			}
			@font-face {
				font-family: 'Golos';
				src: url('%sveltekit.assets%/fonts/golos.woff2') format('woff2');
				font-weight: 400 700;
				font-display: optional;
			}
		</style>
		<!-- Кінетика й поява секцій вмикаються лише з JS і без prefers-reduced-motion -->
		<script>
			if (!matchMedia('(prefers-reduced-motion: reduce)').matches)
				document.documentElement.classList.add('motion');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
